name: Deploy Activity Terrain

on:
  push:
    branches: [main]
    paths:
      - "activity-terrain/**"
      - ".github/workflows/deploy-activity-terrain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-terrain-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: activity-terrain
        run: npm install
      - name: Build app
        working-directory: activity-terrain
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: activity-terrain/dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
