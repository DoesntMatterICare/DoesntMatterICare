<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Let's build something. rehanstudy4@gmail.com">
  <defs>
    <clipPath id="round"><rect width="1000" height="220" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F5A524"/><stop offset=".5" stop-color="#FFE9B8"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5A524" stop-opacity=".35"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".30"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>

    <path fill="url(#w3)" d="M0 120C170 80 330 160 500 120S830 80 1000 120V220H0Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 120C170 80 330 160 500 120S830 80 1000 120V220H0Z;M0 120C170 160 330 80 500 120S830 160 1000 120V220H0Z;M0 120C170 80 330 160 500 120S830 80 1000 120V220H0Z"/>
    </path>
    <path fill="url(#w2)" d="M0 140C150 100 350 180 500 140S850 100 1000 140V220H0Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 140C150 100 350 180 500 140S850 100 1000 140V220H0Z;M0 140C150 180 350 100 500 140S850 180 1000 140V220H0Z;M0 140C150 100 350 180 500 140S850 100 1000 140V220H0Z"/>
    </path>
    <path fill="url(#w1)" d="M0 165C200 135 300 195 500 165S800 135 1000 165V220H0Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0 165C200 135 300 195 500 165S800 135 1000 165V220H0Z;M0 165C200 195 300 135 500 165S800 195 1000 165V220H0Z;M0 165C200 135 300 195 500 165S800 135 1000 165V220H0Z"/>
    </path>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
      <text x="500" y="82" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="5" fill="url(#g)" filter="url(#glow)">LET'S BUILD SOMETHING</text>
      <text x="500" y="122" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="20" fill="#cbd5e1">rehanstudy4@gmail.com</text>
      <text x="500" y="152" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="14" letter-spacing="3" fill="#7d8aa0">OPEN TO COLLABORATIONS  ·  INTERNSHIPS  ·  INTERESTING IDEAS</text>
    </g>

    <rect x="1" y="1" width="998" height="218" rx="21" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="2"/>
  </g>
</svg>
