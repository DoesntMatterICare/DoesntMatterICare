  <g mask="url(#m)">
    <g transform="translate(0 20)">
      <animateTransform attributeName="transform" type="translate" values="0 20;-1312 20" dur="32s" repeatCount="indefinite"/>
      <use href="#row1" x="0"/>
      <use href="#row1" x="1312"/>
    </g>
    <g transform="translate(-1312 84)">
      <animateTransform attributeName="transform" type="translate" values="-1312 84;0 84" dur="36s" repeatCount="indefinite"/>
      <use href="#row2" x="0"/>
      <use href="#row2" x="1312"/>
    </g>
  </g>
</svg>
