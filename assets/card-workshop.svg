<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Virtual Workshop Lab: a viva-prep tool for identifying workshop tools from silhouettes, exploring carpentry joints and wiring live circuits.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#F1EAFF"/><stop offset="1" stop-color="#F5A524"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgl" cx="12%" cy="50%" r="45%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="20" fill="#0a0f1d" stroke="#1e2a44" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="url(#bgl)"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="260 2160" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-2420" dur="6s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- art: swinging hammer + live circuit -->
  <g>
    <g transform="translate(125 48)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-32;18;-32" keyTimes="0;.5;1" calcMode="spline" keySplines=".5 0 .5 1;.5 0 .5 1" dur="1.8s" repeatCount="indefinite"/>
        <rect x="-5" y="0" width="10" height="84" rx="4" fill="#c58b4a"/>
        <rect x="-26" y="-14" width="52" height="22" rx="4" fill="#9aa7ba" stroke="#e6edf3" stroke-width="2"/>
        <path d="M26 -10 l16 -6 v18 l-16 -2z" fill="#9aa7ba"/>
      </g>
    </g>
    <g fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35">
      <path d="M26 190H80V160H130V190H200"/>
      <path d="M26 170H60V196H170V172H200"/>
    </g>
    <g fill="none" stroke="#F5A524" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 200" filter="url(#glow)">
      <path d="M26 190H80V160H130V190H200"><animate attributeName="stroke-dashoffset" values="0;-214" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M26 170H60V196H170V172H200" stroke="#22D3EE"><animate attributeName="stroke-dashoffset" values="0;-214" dur="2.8s" begin=".5s" repeatCount="indefinite"/></path>
    </g>
    <g fill="#F5A524">
      <circle cx="80" cy="160" r="4"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="190" r="4"><animate attributeName="r" values="3;6;3" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="172" r="4" fill="#22D3EE"><animate attributeName="r" values="3;6;3" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
    <!-- joinery block -->
    <path d="M168 62h34v18h-12v10h12v18h-34z" fill="#c58b4a" opacity=".85" stroke="#e8b97d" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="250" y="78" font-size="38" font-weight="800" fill="url(#g)">Virtual Workshop Lab</text>
    <rect x="808" y="36" width="154" height="28" rx="14" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="885" y="55" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#A78BFA">WITH VCEH</text>
    <text x="250" y="114" font-size="18" fill="#aab6c8">A viva-prep tool: identify workshop tools from silhouettes,</text>
    <text x="250" y="140" font-size="18" fill="#aab6c8">explore carpentry joints, and wire live circuits.</text>

    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="250" y="164" width="100" height="30" rx="15" fill="#F5A5241f" stroke="#F5A524"/><text x="300" y="184" fill="#F5A524">UI Design</text>
      <rect x="362" y="164" width="116" height="30" rx="15" fill="#A78BFA1f" stroke="#A78BFA"/><text x="420" y="184" fill="#A78BFA">Full-Stack</text>
    </g>
    <text x="946" y="184" text-anchor="end" font-size="16" font-weight="800" letter-spacing="2" fill="#e6edf3">OPEN REPO
      <tspan fill="#A78BFA"><animate attributeName="dx" values="0;8;0" dur="1.4s" repeatCount="indefinite"/>→</tspan>
    </text>
  </g>
</svg>
