<polygon points="1,23 23,1 999,1 999,191 977,213 1,213" fill="#0b0f12"/>
<g clip-path="url(#c)">
<rect width="1000" height="214" fill="url(#gl)"/>
<rect x="0" y="0" width="5" height="214" fill="#f5c451"/>
<rect x="5" y="0" width="1000" height="1.5" fill="#f5c451" opacity="0"><animate attributeName="y" values="0;214" dur="7s" begin="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.22;.22;0" keyTimes="0;.08;.9;1" dur="7s" begin="4.6s" repeatCount="indefinite"/></rect>
</g>
