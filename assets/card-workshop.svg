<text x="48" y="50" font-size="13" font-weight="700" letter-spacing="2.5" fill="#f5c451" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FILE 03 // WITH VARDHAMAN COLLEGE OF ENGINEERING</text>
<text x="48" y="92" font-size="32" font-weight="800" letter-spacing="3" fill="#e6ebee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">VIRTUAL WORKSHOP LAB</text>
<text x="48" y="126" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">A viva-prep tool for identifying workshop tools from silhouettes,</text><text x="48" y="152" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">exploring carpentry joints, and wiring live circuits.</text><rect x="48" y="168" width="107" height="30" fill="#f5c451" fill-opacity=".07" stroke="#f5c451" stroke-opacity=".45"/><text x="101.5" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#f5c451" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">UI DESIGN</text><rect x="165" y="168" width="219" height="30" fill="#f5c451" fill-opacity=".07" stroke="#f5c451" stroke-opacity=".45"/><text x="274.5" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#f5c451" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FULL-STACK DEVELOPMENT</text>
<text x="940" y="188" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2" fill="#dbe3ea" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">OPEN REPO</text>
<text x="950" y="188" font-size="15" font-weight="700" fill="#f5c451" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&gt;<animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .2 1;.4 0 .2 1"/></text>
