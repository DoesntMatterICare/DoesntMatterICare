<circle r="72" fill="none" stroke="#f5c451" stroke-opacity=".25" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="40s" repeatCount="indefinite"/></circle>
<g opacity=".7"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/>
<circle r="48" fill="none" stroke="#f5c451" stroke-width="13" stroke-dasharray="12.56 12.56"/>
<circle r="37" fill="none" stroke="#f5c451" stroke-width="9"/><circle r="11" fill="#07090b" stroke="#f5c451" stroke-width="3"/></g>
