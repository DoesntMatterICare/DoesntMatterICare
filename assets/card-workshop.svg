<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" width="1000" height="214" role="img" aria-label="Virtual Workshop Lab. A viva-prep tool for identifying workshop tools from silhouettes, exploring carpentry joints, and wiring live circuits.">
<defs><clipPath id="c"><polygon points="1,23 23,1 999,1 999,191 977,213 1,213"/></clipPath>
