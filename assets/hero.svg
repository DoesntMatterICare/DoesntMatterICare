<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Mohammed Rehan: CSE undergrad, developer, product builder">
  <defs>
    <clipPath id="round"><rect width="1000" height="440" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="36%" r="55%">
      <stop offset="0" stop-color="#F5A524" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#22D3EE" stop-opacity=".09"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F5A524"/>
      <stop offset=".5" stop-color="#FFE9B8"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#18233a" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;44 44" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbitA" d="M-240,0 a240,62 0 1,0 480,0 a240,62 0 1,0 -480,0"/>
    <path id="orbitB" d="M-190,0 a190,48 0 1,0 380,0 a190,48 0 1,0 -380,0"/>
    <path id="orbitC" d="M-300,0 a300,80 0 1,0 600,0 a300,80 0 1,0 -600,0"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="440" fill="url(#bg)"/>
    <rect width="1000" height="440" fill="url(#grid)" opacity=".7"/>
    <rect width="1000" height="440" fill="url(#halo)"/>

    <!-- scanning beam -->
    <rect x="0" y="-80" width="1000" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;440" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#F5A524">
      <circle cx="80" cy="420" r="2"><animate attributeName="cy" values="430;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="440" r="1.5"><animate attributeName="cy" values="440;-10" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="430" r="2.5"><animate attributeName="cy" values="430;-10" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="440" r="1.5"><animate attributeName="cy" values="440;-10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="440" r="2"><animate attributeName="cy" values="440;-10" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="430" r="2.5"><animate attributeName="cy" values="430;-10" dur="9.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="440" r="1.5"><animate attributeName="cy" values="440;-10" dur="13s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="430" r="2"><animate attributeName="cy" values="430;-10" dur="10.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10.5s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#22D3EE">
      <circle cx="120" cy="440" r="2"><animate attributeName="cy" values="440;-10" dur="10s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="430" r="1.5"><animate attributeName="cy" values="430;-10" dur="12s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="440" r="2.5"><animate attributeName="cy" values="440;-10" dur="9s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="440" r="1.5"><animate attributeName="cy" values="440;-10" dur="11.5s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11.5s" begin="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="430" r="2"><animate attributeName="cy" values="430;-10" dur="8.5s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbital system -->
    <g transform="translate(500 150)">
      <g transform="rotate(-18)">
        <use href="#orbitA" fill="none" stroke="#F5A524" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 8">
          <animate attributeName="stroke-dashoffset" values="0;-96" dur="6s" repeatCount="indefinite"/>
        </use>
        <circle r="7" fill="#F5A524" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
      </g>
      <g transform="rotate(24)">
        <use href="#orbitB" fill="none" stroke="#22D3EE" stroke-opacity=".5" stroke-width="1.2"/>
        <circle r="6" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orbitB"/></animateMotion></circle>
      </g>
      <g transform="rotate(-48)">
        <use href="#orbitC" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 10">
          <animate attributeName="stroke-dashoffset" values="0;120" dur="8s" repeatCount="indefinite"/>
        </use>
        <circle r="5" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbitC"/></animateMotion></circle>
      </g>

      <!-- pulse rings -->
      <circle r="52" fill="none" stroke="#F5A524" stroke-width="2">
        <animate attributeName="r" values="52;120" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="52" fill="none" stroke="#22D3EE" stroke-width="2">
        <animate attributeName="r" values="52;120" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>

      <!-- core -->
      <circle r="54" fill="#0b1224" stroke="url(#name)" stroke-width="3" filter="url(#glow)"/>
      <circle r="44" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <text y="15" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" fill="url(#name)">MR</text>
    </g>

    <!-- name -->
    <text x="500" y="298" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="7" fill="url(#name)" filter="url(#glow)">MOHAMMED REHAN
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="1.2s" fill="freeze"/>
    </text>

    <!-- rotating tagline -->
    <g font-family="'Courier New',Consolas,monospace" font-size="22" text-anchor="middle" fill="#cbd5e1">
      <text x="500" y="344">CSE undergrad  ·  Developer  ·  Product builder
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="344">Turning early ideas into useful products
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="344">AI-assisted prototyping with Gemini
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- status strip -->
    <g font-family="'Courier New',Consolas,monospace" font-size="14" fill="#7d8aa0" letter-spacing="2">
      <text x="500" y="404" text-anchor="middle">B.TECH CSE  ·  VARDHAMAN COLLEGE OF ENGINEERING  ·  HYDERABAD</text>
      <circle cx="338" cy="400" r="4" fill="#34d399" opacity="0">
        <animate attributeName="opacity" values="0;0" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- frame -->
    <rect x="1" y="1" width="998" height="438" rx="21" fill="none" stroke="url(#name)" stroke-opacity=".5" stroke-width="2"/>
    <rect x="1" y="1" width="998" height="438" rx="21" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-dasharray="90 2280" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2370" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
