<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="CREDENTIALS &amp; RESEARCH">
  <defs>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="2" y="2" width="996" height="72" rx="14" fill="#0a0f1d" stroke="#1e2a44" stroke-width="2"/>
  <text x="28" y="49" font-family="'Courier New',Consolas,monospace" font-size="30" font-weight="800" fill="#F5A524" filter="url(#glow)">//
    <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="72" y="49" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="5" fill="#e6edf3">CREDENTIALS &amp; RESEARCH
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.9s" fill="freeze"/>
  </text>
  <rect x="28" y="60" width="0" height="3" rx="1.5" fill="url(#u)">
    <animate attributeName="width" values="0;944;944;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="28" cy="61.5" r="5" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="28;972;972;28" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.35;0.4;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
