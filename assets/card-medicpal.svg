<text x="48" y="126" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">An AI-assisted medicine reminder app that helps older adults</text><text x="48" y="152" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">and people with dementia manage their medication.</text><rect x="48" y="168" width="82" height="30" fill="#9fb3c8" fill-opacity=".07" stroke="#9fb3c8" stroke-opacity=".45"/><text x="89.0" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#9fb3c8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PYTHON</text><rect x="140" y="168" width="116" height="30" fill="#9fb3c8" fill-opacity=".07" stroke="#9fb3c8" stroke-opacity=".45"/><text x="198.0" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#9fb3c8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TYPESCRIPT</text><text x="272" y="188" font-size="13" letter-spacing="1" fill="#7b8794" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WITH MOHAMMED ABDUR REHMAN &amp; TEAMMATES</text>
