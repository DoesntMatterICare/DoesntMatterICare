<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="MedicPal: an AI-assisted medicine reminder app for older adults and people with dementia. Team project.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#C9F6FF"/><stop offset="1" stop-color="#F5A524"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgl" cx="12%" cy="50%" r="45%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="loop" d="M63,112 a62,62 0 1,0 124,0 a62,62 0 1,0 -124,0"/>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="20" fill="#0a0f1d" stroke="#1e2a44" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="url(#bgl)"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="260 2160" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-2420" dur="6s" begin="1s" repeatCount="indefinite"/>
  </rect>

  <!-- art: clock with capsule orbiting a reminder path -->
  <use href="#loop" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="5s" repeatCount="indefinite"/>
  </use>
  <circle cx="125" cy="112" r="40" fill="#101a30" stroke="#F5A524" stroke-width="3" filter="url(#glow)"/>
  <g stroke="#e6edf3" stroke-width="2" opacity=".6">
    <path d="M125 76v6M125 142v6M89 112h6M155 112h6"/>
  </g>
  <g stroke-linecap="round">
    <line x1="125" y1="112" x2="125" y2="88" stroke="#22D3EE" stroke-width="4">
      <animateTransform attributeName="transform" type="rotate" values="0 125 112;360 125 112" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="125" y1="112" x2="125" y2="96" stroke="#F5A524" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" values="0 125 112;360 125 112" dur="30s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="125" cy="112" r="4" fill="#fff"/>
  <g filter="url(#glow)">
    <g>
      <rect x="-20" y="-9" width="20" height="18" rx="9" fill="#F5A524"/>
      <rect x="0" y="-9" width="20" height="18" rx="9" fill="#22D3EE"/>
      <rect x="-9" y="-9" width="18" height="18" fill="none"/>
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion>
    </g>
  </g>
  <!-- bell wiggle -->
  <g transform="translate(190 52)">
    <path d="M0 14c0-8 5-12 10-12s10 4 10 12v6l3 4H-3l3-4z" fill="#F5A524">
      <animateTransform attributeName="transform" type="rotate" values="0 10 2;14 10 2;-14 10 2;10 10 2;0 10 2;0 10 2" keyTimes="0;.1;.2;.3;.4;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="10" cy="28" r="3" fill="#F5A524"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="250" y="78" font-size="38" font-weight="800" fill="url(#g)">MedicPal</text>
    <rect x="808" y="36" width="154" height="28" rx="14" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="885" y="55" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#22D3EE">TEAM PROJECT</text>
    <text x="250" y="114" font-size="18" fill="#aab6c8">An AI-assisted medicine reminder app helping older adults</text>
    <text x="250" y="140" font-size="18" fill="#aab6c8">and people with dementia manage their medication.</text>

    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="250" y="164" width="86" height="30" rx="15" fill="#3776AB33" stroke="#4B8BBE"/><text x="293" y="184" fill="#7db8e8">Python</text>
      <rect x="348" y="164" width="116" height="30" rx="15" fill="#3178C633" stroke="#3178C6"/><text x="406" y="184" fill="#78aef0">TypeScript</text>
    </g>
    <text x="482" y="184" font-size="14" fill="#7d8aa0">with Mohammed Abdur Rehman &amp; teammates</text>
    <text x="946" y="184" text-anchor="end" font-size="16" font-weight="800" letter-spacing="2" fill="#e6edf3">OPEN REPO
      <tspan fill="#22D3EE"><animate attributeName="dx" values="0;8;0" dur="1.4s" repeatCount="indefinite"/>→</tspan>
    </text>
  </g>
</svg>
