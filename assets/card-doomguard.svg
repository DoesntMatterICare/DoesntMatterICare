<text x="48" y="126" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">A Chrome extension that detects doomscrolling</text><text x="48" y="152" font-size="18" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">patterns and intervenes in real time.</text><rect x="48" y="168" width="159" height="30" fill="#3DDC97" fill-opacity=".07" stroke="#3DDC97" stroke-opacity=".45"/><text x="127.5" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#3DDC97" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WEB DEVELOPMENT</text><rect x="217" y="168" width="185" height="30" fill="#3DDC97" fill-opacity=".07" stroke="#3DDC97" stroke-opacity=".45"/><text x="309.5" y="188" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#3DDC97" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PROMPT ENGINEERING</text>
<text x="940" y="188" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2" fill="#dbe3ea" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">OPEN REPO</text>
