<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="DoomGuard: a Chrome extension that detects doomscrolling patterns and intervenes in real time. April 2026.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F5A524"/><stop offset=".5" stop-color="#FFE9B8"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgl" cx="12%" cy="50%" r="45%"><stop offset="0" stop-color="#F5A524" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="art"><rect x="0" y="0" width="220" height="220"/></clipPath>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="20" fill="#0a0f1d" stroke="#1e2a44" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="url(#bgl)"/>
  <rect x="2" y="2" width="996" height="216" rx="20" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="260 2160" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-2420" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- art: feed streams stopped by a shield -->
  <g clip-path="url(#art)">
    <g fill="#22D3EE">
      <rect x="0" y="62" width="34" height="8" rx="4" opacity="0"><animate attributeName="x" values="-40;50" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="0" y="86" width="44" height="8" rx="4" opacity="0"><animate attributeName="x" values="-50;42" dur="2.9s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="2.9s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="0" y="110" width="30" height="8" rx="4" opacity="0"><animate attributeName="x" values="-40;54" dur="2.2s" begin=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="2.2s" begin=".9s" repeatCount="indefinite"/></rect>
      <rect x="0" y="134" width="40" height="8" rx="4" opacity="0"><animate attributeName="x" values="-50;46" dur="2.7s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></rect>
      <rect x="0" y="158" width="34" height="8" rx="4" opacity="0"><animate attributeName="x" values="-40;50" dur="2.5s" begin=".2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="2.5s" begin=".2s" repeatCount="indefinite"/></rect>
    </g>
    <circle cx="125" cy="112" r="50" fill="none" stroke="#F5A524" stroke-width="2">
      <animate attributeName="r" values="50;96" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#glow)">
      <path d="M125 48 L180 70 V114 C180 150 156 172 125 184 C94 172 70 150 70 114 V70 Z" fill="#101a30" stroke="#F5A524" stroke-width="4">
        <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="2.6s" additionalTransform="replace" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="110" y="94" width="10" height="44" rx="3" fill="#F5A524"><animate attributeName="height" values="44;30;44" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="130" y="94" width="10" height="44" rx="3" fill="#22D3EE"><animate attributeName="height" values="44;30;44" dur="1.6s" begin=".2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="250" y="78" font-size="38" font-weight="800" fill="url(#g)">DoomGuard</text>
    <rect x="850" y="36" width="112" height="28" rx="14" fill="none" stroke="#F5A524" stroke-width="1.5"/>
    <text x="906" y="55" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#F5A524">APR 2026</text>
    <text x="250" y="114" font-size="18" fill="#aab6c8">A Chrome extension that detects doomscrolling patterns</text>
    <text x="250" y="140" font-size="18" fill="#aab6c8">and intervenes in real time.</text>

    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="250" y="164" width="150" height="30" rx="15" fill="#F5A5241f" stroke="#F5A524"/><text x="325" y="184" fill="#F5A524">Web Development</text>
      <rect x="412" y="164" width="178" height="30" rx="15" fill="#22D3EE1f" stroke="#22D3EE"/><text x="501" y="184" fill="#22D3EE">Prompt Engineering</text>
    </g>
    <g transform="translate(0 0)">
      <text x="946" y="184" text-anchor="end" font-size="16" font-weight="800" letter-spacing="2" fill="#e6edf3">OPEN REPO
        <tspan fill="#F5A524">
          <animate attributeName="dx" values="0;8;0" dur="1.4s" repeatCount="indefinite"/>→</tspan>
      </text>
    </g>
  </g>
</svg>
